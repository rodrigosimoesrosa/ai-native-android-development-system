name: CI

# The "green = done" gate (Constitution Principle III + the merge human-gate). Runs the method
# guardrails (fast, no Gradle), then the full JVM unit-test suite + static analysis (detekt), then the
# instrumented (connectedAndroidTest) suite on a hardware-accelerated emulator. A read-only `metrics`
# job (ADR-0010) computes process health from git history and publishes it to the run summary.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Knowledge layer + links (docs are tested)
        run: bash scripts/check-knowledge.sh
      - name: Neutral-core / adapter boundary (ADR-0001)
        run: bash scripts/check-adapter-boundary.sh

  build:
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Unit tests (all modules)
        run: ./gradlew test --stacktrace --console=plain

      - name: Static analysis (detekt)
        run: ./gradlew detekt --console=plain

  instrumented:
    # The instrumented slice of the gate: nav behavior (spec 003, T007) runs on a real Android runtime.
    # Free on public repos with standard Linux runners; KVM gives the emulator hardware acceleration.
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        api-level: [ 34 ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable KVM (hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Instrumented tests (:feature:navigation) on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: ./gradlew :feature:navigation:connectedDebugAndroidTest --console=plain

  metrics:
    # Process health measured from git, not asserted (ADR-0010 / vision §7). Read-only; no build deps.
    # Publishes to the run summary and uploads a text artifact. Full history is required for the counts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # metrics.sh counts commits + reads Provenance-* trailers across history

      - name: Compute process metrics
        run: |
          bash scripts/metrics.sh | tee metrics.txt
          bash scripts/metrics.sh --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: process-metrics
          path: metrics.txt
