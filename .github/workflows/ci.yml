name: CI

# The "green = done" gate (Constitution Principle III + the merge human-gate). Runs the method
# guardrails (fast, no Gradle), then the full JVM unit-test suite, then static analysis (detekt).
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Knowledge layer + links (docs are tested)
        run: bash scripts/check-knowledge.sh
      - name: Neutral-core / adapter boundary (ADR-0001)
        run: bash scripts/check-adapter-boundary.sh

  build:
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Unit tests (all modules)
        run: ./gradlew test --stacktrace --console=plain

      - name: Static analysis (detekt)
        run: ./gradlew detekt --console=plain
